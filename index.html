<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bino – WhatsApp AI Assistant</title>

<style>
body{
font-family:Arial, sans-serif;
background:#dfe5ec;
margin:0;
padding:0;
}

.phone{
max-width:420px;
margin:20px auto;
background:#e5ddd5;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,0.25);
overflow:hidden;
}

.header{
background:#075E54;
color:white;
padding:14px;
font-size:18px;
text-align:left;
}

.chat{
padding:15px;
min-height:420px;
}

.msg{
padding:10px 14px;
margin:8px 0;
border-radius:10px;
max-width:75%;
font-size:15px;
}

.user{
background:#dcf8c6;
margin-left:auto;
}

.bot{
background:white;
border:1px solid #ddd;
}

.controls{
padding:12px;
background:#f0f0f0;
text-align:center;
}

button{
padding:8px 14px;
margin:5px;
border:none;
border-radius:8px;
background:#25D366;
color:white;
cursor:pointer;
font-size:14px;
}
</style>

<script>
function reply(text, response){
let chat=document.getElementById("chat");

chat.innerHTML+=`<div class="msg user">${text}</div>`;

setTimeout(()=>{
chat.innerHTML+=`<div class="msg bot">${response}</div>`;
chat.scrollTop=chat.scrollHeight;
},800);
}

function food(){
reply(
"Find best biryani near me",
"Bino AI 🍽️: Top rated biryani places near you are Paradise, Bawarchi and Mehfil."
);
}

function study(){
reply(
"Explain machine learning simply",
"Bino AI 🤖: Machine learning lets computers learn from data and improve without being programmed step-by-step."
);
}

function news(){
reply(
"Give today’s news",
"Bino AI 📰: Today’s highlights — tech growth rising, AI adoption increasing, and markets stable."
);
}
</script>

</head>

<body>

<div class="phone">

<div class="header">
Bino AI Assistant
</div>

<div id="chat" class="chat"></div>

<div class="controls">
<button onclick="food()">Food</button>
<button onclick="study()">Study</button>
<button onclick="news()">News</button>
</div>

</div>

</body>
</html>
