<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bino Assistant</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
            color:white;
            text-align:center;
        }

        .container{
            margin-top:120px;
        }

        h1{
            font-size:42px;
            margin-bottom:10px;
        }

        p{
            font-size:18px;
            color:#ddd;
        }

        .btn{
            display:inline-block;
            margin-top:40px;
            padding:16px 35px;
            font-size:18px;
            color:white;
            background:#25D366;
            border:none;
            border-radius:8px;
            text-decoration:none;
            transition:0.3s;
        }

        .btn:hover{
            background:#1ebe5d;
            transform:scale(1.05);
        }

        footer{
            margin-top:120px;
            font-size:14px;
            color:#aaa;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤖 Bino Assistant</h1>
    <p>Your smart WhatsApp helper for food, news and daily info</p>

    <!-- FINAL WORKING BUTTON -->
    <a class="btn"
       href="https://wa.me/918762192191?text=Hi%20Bino%2C%20I%20want%20help%20with%20food%20and%20news"
       target="_blank">
       Try Bino on WhatsApp
    </a>
</div>

<footer>
    Demo project by Student • Powered by Bino Assistant
</footer>

</body>
</html>
