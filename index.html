<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bino – Search Without Opening Apps</title>
<style>
body{
font-family:Arial;
background:#eef2f7;
padding:40px;
text-align:center;
}
.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
h1{color:#1c2b4a;}
.chat{
background:#f1f3f6;
padding:15px;
border-radius:10px;
margin-top:20px;
text-align:left;
min-height:120px;
}
.msg{
margin:8px 0;
padding:10px;
border-radius:8px;
max-width:70%;
}
.user{background:#dcf8c6;margin-left:auto;}
.bot{background:white;border:1px solid #ddd;}
button{
margin:8px;
padding:10px 16px;
border:none;
border-radius:8px;
background:#25D366;
color:white;
cursor:pointer;
}
</style>

<script>
function demo(type){
let chat=document.getElementById("chat");

if(type=="food"){
chat.innerHTML+=`<div class="msg user">Find best biryani near me</div>
<div class="msg bot">Here are top-rated biryani places near you ⭐</div>`;
}
if(type=="ml"){
chat.innerHTML+=`<div class="msg user">Explain machine learning simply</div>
<div class="msg bot">Machine learning lets computers learn from data instead of rules.</div>`;
}
if(type=="news"){
chat.innerHTML+=`<div class="msg user">Summarize today's news</div>
<div class="msg bot">Here’s a quick 60-second news summary for today 📰</div>`;
}
}
</script>
</head>

<body>
<div class="container">

<h1>Bino – Search Without Opening Apps</h1>
<p>Why open 5 apps when one WhatsApp chat can do it all?</p>

<div>
<button onclick="demo('food')">Find Food</button>
<button onclick="demo('ml')">Explain Concept</button>
<button onclick="demo('news')">Get News</button>
</div>

<div id="chat" class="chat"></div>

<p style="margin-top:20px;">
Bino turns WhatsApp into your universal search assistant.
</p>

<button onclick="alert('Replace with Bino WhatsApp link')">
Try Bino Now
</button>

</div>
</body>
</html>
